<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- ถ้าไม่มีฟอนต์ไทยของ Windows/ราชการ ให้ใช้ Sarabun TH Compat (ขนาดเท่ากัน) แทน
     ถ้าวางไฟล์ฟอนต์จริง (เช่น THSarabunNew.ttf) ไว้ในโฟลเดอร์ fonts/ ระบบจะใช้ฟอนต์จริงก่อน -->
<fontconfig>
  <alias binding="same"><family>TH Sarabun New</family><prefer><family>Sarabun TH Compat</family></prefer></alias>
  <alias binding="same"><family>TH SarabunPSK</family><prefer><family>Sarabun TH Compat</family></prefer></alias>
  <alias binding="same"><family>TH SarabunIT๙</family><prefer><family>Sarabun TH Compat</family></prefer></alias>
  <alias binding="same"><family>TH Sarabun IT9</family><prefer><family>Sarabun TH Compat</family></prefer></alias>
  <alias binding="same"><family>Angsana New</family><prefer><family>Sarabun TH Compat</family></prefer></alias>
  <alias binding="same"><family>AngsanaUPC</family><prefer><family>Sarabun TH Compat</family></prefer></alias>
  <alias binding="same"><family>Cordia New</family><prefer><family>Sarabun TH Compat</family></prefer></alias>
  <alias binding="same"><family>CordiaUPC</family><prefer><family>Sarabun TH Compat</family></prefer></alias>
  <alias binding="same"><family>Browallia New</family><prefer><family>Sarabun TH Compat</family></prefer></alias>
  <alias binding="same"><family>Tahoma</family><prefer><family>Loma</family></prefer></alias>
  <alias binding="same"><family>Leelawadee UI</family><prefer><family>Noto Sans Thai</family></prefer></alias>
</fontconfig>
